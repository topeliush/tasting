<!DOCTYPE html>
<html lang="fi" data-theme="vaalea">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e8d390">
<title>Viinitasting.com · Tasting</title>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/app.js?v=36" as="script">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css?v=30">
<style>
.lataus { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--vali-6) var(--vali-5); }
.lataus > div { max-width: 480px; }
/* Tervetulo- ja latausanimaatio: Viinitasting.com-sanamerkki keinuu ja sen läpi nousee kuplia. */
.sanamerkki { display: block; width: 180px; height: auto; margin: 0 auto var(--vali-5); overflow: visible; }
.sanamerkki .sana { font-family: var(--font-display); font-size: 34px; fill: var(--vihrea); text-anchor: middle; }
.sanamerkki .rivi { animation: sm-keinu 2.6s ease-in-out infinite; animation-delay: var(--d); }
.sanamerkki .kupla { fill: none; stroke: var(--viini-kuohu); stroke-width: 2.5; opacity: 0; animation: sm-nousu var(--t) linear infinite; animation-delay: var(--d); }
@keyframes sm-keinu { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes sm-nousu { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .9; } 50% { transform: translate(6px, -80px); } 90% { opacity: .9; } 100% { transform: translate(-4px, -160px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sanamerkki * { animation: none !important; } }
</style>
</head>
<body>
<div id="app"><main class="lataus"><div><svg class="sanamerkki" viewBox="0 0 200 150" role="img" aria-label="viinitasting.com"><g aria-hidden="true"><circle class="kupla" cx="30" cy="160" r="5" style="--t:4.2s;--d:-1s"/><circle class="kupla" cx="52" cy="160" r="3" style="--t:3.4s;--d:-2.6s"/><circle class="kupla" cx="78" cy="160" r="6" style="--t:5s;--d:-0.4s"/><circle class="kupla" cx="104" cy="160" r="4" style="--t:3.8s;--d:-3s"/><circle class="kupla" cx="128" cy="160" r="5" style="--t:4.6s;--d:-1.8s"/><circle class="kupla" cx="150" cy="160" r="3" style="--t:3.2s;--d:-0.9s"/><circle class="kupla" cx="172" cy="160" r="6" style="--t:5.4s;--d:-3.6s"/><circle class="kupla" cx="90" cy="160" r="3" style="--t:3s;--d:-2s"/><circle class="kupla" cx="140" cy="160" r="4" style="--t:4s;--d:-3.2s"/><circle class="kupla" cx="64" cy="160" r="4" style="--t:4.4s;--d:-4s"/></g><g class="rivi" style="--d:0s"><text class="sana" x="100" y="44">viini</text></g><g class="rivi" style="--d:.25s"><text class="sana" x="100" y="86">tasting</text></g><g class="rivi" style="--d:.5s"><text class="sana" x="100" y="128">.com</text></g></svg><p class="o-display">Tervetuloa</p><p class="o-ingressi" style="margin-top:var(--vali-4)" id="lataus-teksti">Ladataan tastingia…</p></div></main></div>
<noscript>Tämä sivu tarvitsee JavaScriptin.</noscript>
<script src="/asetukset.js"></script>
<script src="/emojit.js?v=20"></script>
<script src="/yhteys.js?v=22"></script>
<script src="/qr.js"></script>
<script>
(function () {
  var haku = new URLSearchParams(location.search);
  var id = (haku.get("t") || "").trim().toLowerCase();
  var esikatselu = (haku.get("esikatselu") || "").trim().toLowerCase();
  // Kokeilu (?t=<tunnus>&kokeilu=1): asiakas voi kokeilla settiä etukäteen. Mitään ei tallenneta, eikä kokeilu sekoita illan tilaa samalla puhelimella.
  var kokeilu = haku.get("kokeilu") === "1";
  var teksti = document.getElementById("lataus-teksti");
  function viesti(t, linkki) {
    teksti.textContent = t;
    if (linkki) {
      var p = document.createElement("p"); p.style.marginTop = "var(--vali-6)";
      p.innerHTML = '<a class="vt-painike" href="https://viinitasting.com">Varaa oma tasting</a>';
      teksti.parentNode.appendChild(p);
    }
  }
  function kaynnista(t, tunnus) {
    t.id = tunnus;
    t.osoite = location.origin + "/?t=" + (t.kokeilu ? id : t.esikatselu ? esikatselu : tunnus);
    window.TASTING = t;
    document.title = (t.nimi || "Tasting") + " · Viinitasting.com";
    var s = document.createElement("script"); s.src = "/app.js?v=36"; document.body.appendChild(s);
  }
  // Esikatselu hallinnasta: tallentamaton setti tulee selaimen muistista, eikä mitään tallenneta palvelimelle.
  if (esikatselu && /^[a-z0-9-]{1,60}$/.test(esikatselu)) {
    var data = null;
    try { data = JSON.parse(localStorage.getItem("vt-esikatselu") || "null"); localStorage.removeItem("vt-tasting-esikatselu-" + esikatselu); } catch (e) {}
    if (!data) { viesti("Esikatselu ei auennut. Avaa se uudelleen hallinnasta."); return; }
    data.esikatselu = true;
    kaynnista(data, "esikatselu-" + esikatselu);
    return;
  }
  if (!id) { viesti("Skannaa tilaisuuden QR-koodi, niin pääset illan tastingiin.", true); return; }
  if (!/^[a-z0-9-]{1,60}$/.test(id) || !window.VTData) { viesti("Tastingia ei löytynyt. Tarkista linkki.", true); return; }
  var aikaraja = setTimeout(function () { viesti("Yhteys on hidas. Odota hetki tai lataa sivu uudelleen."); }, 10000);
  var EI_VOIMASSA = "Tämä tasting-linkki ei ole enää voimassa. Kiitos, että maistelitte kanssamme!";
  window.VTData.haeTasting(id).then(function (t) {
    clearTimeout(aikaraja);
    if (!t) { viesti("Tastingia ei löytynyt. Tarkista linkki.", true); return; }
    if (t.voimassaAstiMs && t.voimassaAstiMs < Date.now()) { viesti(EI_VOIMASSA, true); return; }
    if (kokeilu) { t.esikatselu = true; t.kokeilu = true; kaynnista(t, "kokeilu-" + id); return; }
    kaynnista(t, id);
  }, function (e) {
    clearTimeout(aikaraja);
    // Firestore-säännöt eivät näytä vanhentunutta omatoimisettiä eivätkä omatoimipohjaa.
    if (e && e.code === "permission-denied") { viesti(EI_VOIMASSA, true); return; }
    viesti("Tastingin lataus epäonnistui. Lataa sivu uudelleen.");
  });
})();
</script>
</body>
</html>
