<style>
.lataus { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--vali-6) var(--vali-5); }
.lataus > div { max-width: 480px; }
/* Tervetulo- ja latausanimaatio: kaksi kuohuviinilasia täyttyvät ja kilistävät. */
.kippis { display: block; width: 170px; height: auto; margin: 0 auto var(--vali-5); overflow: visible; }
.kippis .tausta { fill: var(--pinta); fill-opacity: 0.6; }
.kippis .lasi { fill: none; stroke: var(--teksti); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.kippis .jalka { fill: none; stroke: var(--teksti); stroke-width: 4; stroke-linecap: round; }
.kippis .viini { fill: var(--viini-kuohu); animation: kippis-tayttyy 1.4s cubic-bezier(.3,.7,.3,1) both; }
.kippis .kupla { fill: var(--voi); opacity: 0; animation: kippis-kupla 1.8s ease-in infinite; }
.kippis .vasen { animation: kippis-vasen 3.6s 1.4s ease-in-out infinite; }
.kippis .oikea { animation: kippis-oikea 3.6s 1.4s ease-in-out infinite; }
.kippis .kipina { stroke: var(--vihrea-syva); stroke-width: 3; stroke-linecap: round; opacity: 0; animation: kippis-kipina 3.6s 1.4s ease-out infinite; }
@keyframes kippis-tayttyy { from { transform: translateY(54px); } to { transform: translateY(0); } }
@keyframes kippis-kupla { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateY(-44px); opacity: 0; } }
@keyframes kippis-vasen { 0%, 48%, 92%, 100% { transform: rotate(0); } 62%, 70% { transform: rotate(5deg); } }
@keyframes kippis-oikea { 0%, 48%, 92%, 100% { transform: rotate(0); } 62%, 70% { transform: rotate(-5deg); } }
@keyframes kippis-kipina { 0%, 60% { opacity: 0; transform: scale(.4); } 66% { opacity: 1; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
@media (prefers-reduced-motion: reduce) { .kippis * { animation: none !important; } .kippis .kupla { opacity: .8; } }
</style>

<div id="app"><main class="lataus"><div><svg class="kippis" viewBox="0 -16 200 152" aria-hidden="true" focusable="false"><defs><clipPath id="kippis-malja"><path d="M-18,-118 C-18,-83 -14,-58 0,-50 C14,-58 18,-83 18,-118 Z"/></clipPath></defs><g transform="translate(72,128)"><g class="vasen"><path class="tausta" d="M-18,-118 C-18,-83 -14,-58 0,-50 C14,-58 18,-83 18,-118 Z"/><g clip-path="url(#kippis-malja)"><rect class="viini" x="-20" y="-104" width="40" height="56"/><circle class="kupla" cx="-6" cy="-56" r="2.2" style="animation-delay:0s"/><circle class="kupla" cx="3" cy="-56" r="1.6" style="animation-delay:0.5s"/><circle class="kupla" cx="7" cy="-56" r="2" style="animation-delay:1.1s"/><circle class="kupla" cx="-2" cy="-56" r="1.4" style="animation-delay:1.4s"/></g><path class="lasi" d="M-18,-118 C-18,-83 -14,-58 0,-50 C14,-58 18,-83 18,-118 Z"/><path class="jalka" d="M0,-50 V-3 M-19,0 Q0,-6 19,0"/></g></g><g transform="translate(128,128)"><g class="oikea"><path class="tausta" d="M-18,-118 C-18,-83 -14,-58 0,-50 C14,-58 18,-83 18,-118 Z"/><g clip-path="url(#kippis-malja)"><rect class="viini" x="-20" y="-104" width="40" height="56"/><circle class="kupla" cx="-6" cy="-56" r="2.2" style="animation-delay:0s"/><circle class="kupla" cx="3" cy="-56" r="1.6" style="animation-delay:0.5s"/><circle class="kupla" cx="7" cy="-56" r="2" style="animation-delay:1.1s"/><circle class="kupla" cx="-2" cy="-56" r="1.4" style="animation-delay:1.4s"/></g><path class="lasi" d="M-18,-118 C-18,-83 -14,-58 0,-50 C14,-58 18,-83 18,-118 Z"/><path class="jalka" d="M0,-50 V-3 M-19,0 Q0,-6 19,0"/></g></g><g transform="translate(100,6)"><g class="kipina"><path d="M0,-6 V-14 M7,-3 L13,-9 M-7,-3 L-13,-9 M10,4 H17 M-10,4 H-17"/></g></g></svg><p class="o-display">Tervetuloa</p><p class="o-ingressi" style="margin-top:var(--vali-4)" id="lataus-teksti">Ladataan tastingia…</p></div></main></div>
<noscript>Tämä sivu tarvitsee JavaScriptin.</noscript>

<script>
(function () {
  var haku = new URLSearchParams(location.search);
  var id = (haku.get("t") || "").trim().toLowerCase();
  var esikatselu = (haku.get("esikatselu") || "").trim().toLowerCase();
  // Kokeilu (?t=<tunnus>&kokeilu=1): asiakas voi kokeilla settiä etukäteen. Mitään ei tallenneta, eikä kokeilu sekoita illan tilaa samalla puhelimella.
  var kokeilu = haku.get("kokeilu") === "1";
  var teksti = document.getElementById("lataus-teksti");
  function viesti(t, linkki) {
    teksti.textContent = t;
    if (linkki) {
      var p = document.createElement("p"); p.style.marginTop = "var(--vali-6)";
      p.innerHTML = '<a class="vt-painike" href="https://viinitasting.com">Varaa oma tasting</a>';
      teksti.parentNode.appendChild(p);
    }
  }
  function kaynnista(t, tunnus) {
    t.id = tunnus;
    t.osoite = location.origin + "/?t=" + (t.kokeilu ? id : t.esikatselu ? esikatselu : tunnus);
    window.TASTING = t;
    document.title = (t.nimi || "Tasting") + " · Viinitasting.com";
    var s = document.createElement("script"); s.src = "/app.js?v=36"; document.body.appendChild(s);
  }
  // Esikatselu hallinnasta: tallentamaton setti tulee selaimen muistista, eikä mitään tallenneta palvelimelle.
  if (esikatselu && /^[a-z0-9-]{1,60}$/.test(esikatselu)) {
    var data = null;
    try { data = JSON.parse(localStorage.getItem("vt-esikatselu") || "null"); localStorage.removeItem("vt-tasting-esikatselu-" + esikatselu); } catch (e) {}
    if (!data) { viesti("Esikatselu ei auennut. Avaa se uudelleen hallinnasta."); return; }
    data.esikatselu = true;
    kaynnista(data, "esikatselu-" + esikatselu);
    return;
  }
  if (!id) { viesti("Skannaa tilaisuuden QR-koodi, niin pääset illan tastingiin.", true); return; }
  if (!/^[a-z0-9-]{1,60}$/.test(id) || !window.VTData) { viesti("Tastingia ei löytynyt. Tarkista linkki.", true); return; }
  var aikaraja = setTimeout(function () { viesti("Yhteys on hidas. Odota hetki tai lataa sivu uudelleen."); }, 10000);
  var EI_VOIMASSA = "Tämä tasting-linkki ei ole enää voimassa. Kiitos, että maistelitte kanssamme!";
  window.VTData.haeTasting(id).then(function (t) {
    clearTimeout(aikaraja);
    if (!t) { viesti("Tastingia ei löytynyt. Tarkista linkki.", true); return; }
    if (t.voimassaAstiMs && t.voimassaAstiMs < Date.now()) { viesti(EI_VOIMASSA, true); return; }
    if (kokeilu) { t.esikatselu = true; t.kokeilu = true; kaynnista(t, "kokeilu-" + id); return; }
    kaynnista(t, id);
  }, function (e) {
    clearTimeout(aikaraja);
    // Firestore-säännöt eivät näytä vanhentunutta omatoimisettiä eivätkä omatoimipohjaa.
    if (e && e.code === "permission-denied") { viesti(EI_VOIMASSA, true); return; }
    viesti("Tastingin lataus epäonnistui. Lataa sivu uudelleen.");
  });
})();
</script>
